name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: unit
        run: node test/unit.test.js
      - name: security
        run: node test/security.test.js
      - name: e2e
        run: node test/e2e.test.js
      - name: learning model and API
        run: node test/learning.test.js
      - name: bounded launcher smoke
        shell: bash
        run: |
          set -euo pipefail
          trap 'bash stop.sh' EXIT
          PAYMATE_PORT=19771 bash start.sh
          curl --fail --silent --max-time 5 http://127.0.0.1:19771/api/learn/model
