name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: unit
        run: node test/unit.test.js
      - name: security
        run: node test/security.test.js
      - name: e2e
        run: node test/e2e.test.js
